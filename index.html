*{box-sizing:border-box}html,body{height:auto}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.6 'IBM Plex Sans Arabic',system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:.2em 0}h2{font-size:20px;margin:.2em 0 .5em}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin:12px 0}
.ar{direction:rtl;text-align:right}.sq .ar{direction:ltr;text-align:left}.m{color:var(--m);font-size:14px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:10px;padding:10px 14px;text-decoration:none;display:inline-block}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.pri{background:var(--p);color:#fff;border-color:var(--p);font-weight:600}:root[data-theme=dark] .pri{color:#0d1422}

button:disabled{opacity:.45;cursor:not-allowed}
.opt{display:block;width:100%;text-align:left;margin:8px 0}.opt.ok{background:var(--okl);border-color:var(--ok)}.opt.no{background:var(--badl);border-color:var(--bad)}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{white-space:nowrap;padding:8px 12px}nav .on{background:var(--p);color:#fff;border-color:var(--p)}
textarea,input,select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--t)}textarea{min-height:170px}
.bar{height:10px;background:var(--pl);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{font-size:30px;font-weight:700;line-height:1.1}
.fb{border-inline-start:4px solid var(--p);background:var(--pl);padding:10px 12px;border-radius:8px;margin:8px 0}
.chip{display:inline-block;border:1px solid var(--b);border-radius:20px;padding:2px 10px;margin:3px;font-size:14px;cursor:pointer}
.tag{display:inline-block;background:var(--p);color:#fff;border-radius:8px;padding:0 10px;font-weight:700}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tag{color:#0d1422}}
